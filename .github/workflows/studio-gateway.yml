name: Studio gateway

on:
  push:
    branches: [main]
    paths: ['tools/studio-gateway/**', 'tools/ripple/**', '.github/workflows/studio-gateway.yml']
  pull_request:
    paths: ['tools/studio-gateway/**', 'tools/ripple/**', '.github/workflows/studio-gateway.yml']

permissions:
  contents: read

concurrency:
  group: studio-gateway-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

jobs:
  cpu-contracts:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.11'
      - name: Gateway lifecycle, authentication, isolation and admission
        run: python3 -m unittest discover -s tools/studio-gateway/tests -p 'test_*.py' -v
      - name: Optional MLX test modules skip without their documented environment
        run: python3 -m unittest discover -s tools/ripple -p 'test_*.py' -v
